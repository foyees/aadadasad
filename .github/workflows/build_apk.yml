name: Build PressNest APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Flet & Build APK
        run: |
          pip install "flet[all]==0.24.1"
          flet build apk --project "PressNest Estimator"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PressNest-Estimator-APK
          path: build/apk/*.apk
